<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - {{ settings.HOSPITAL_NAME }}</title>
  
  <!-- Minimalist Clinical CSS Design System -->
  <link rel="stylesheet" href="/static/css/tokens.css?v=staff-ux-1">
  <link rel="stylesheet" href="/static/css/base.css?v=staff-ux-1">
  <link rel="stylesheet" href="/static/css/components.css?v=staff-ux-1">

  <script src="/static/js/core.js"></script>

<body>

</html>
